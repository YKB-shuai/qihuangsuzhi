[project]
name = "zhongyishizhan"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "杨开兵", email = "yangkaibing_2023@qq.com" }
]
requires-python = ">=3.14"
dependencies = [
    "chromadb>=1.5.9",
    "dbutils>=3.2.0",
    "fastapi>=0.141.1",
    "jieba>=0.42.1",
    "langchain>=1.4.0",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-mineru>=0.1.3",
    "langchain-tavily>=0.2.18",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.11",
    "modelscope>=1.40.1",
    "numpy>=2.5.3",
    "pypdf>=6.0.0",
    "pymysql>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "uvicorn[standard]>=0.53.0",
    "langchain-deepseek>=1.1.0",
    "reportlab>=5.0.1",
]

[project.scripts]
zhongyishizhan = "zhongyishizhan:main"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
