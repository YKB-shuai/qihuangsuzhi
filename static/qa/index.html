<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>岐黄溯智 · 智能问答</title>
  <link rel="stylesheet" href="/lib/bootstrap/bootstrap.min.css">
  <!-- 品牌版本守卫：检测到旧缓存页自动刷新到新版 -->
  <script>
  (function(){
    try {
      if (sessionStorage.getItem('qh_vguard_ok') === '1') return;
      var html = document.documentElement.innerHTML || '';
      if (html.indexOf('东方草木') !== -1 || html.indexOf('ORIENTAL HERBS') !== -1) {
        sessionStorage.setItem('qh_vguard_ok','1');
        var u = new URL(location.href);
        u.searchParams.set('_v', String(Date.now()));
        location.replace(u.toString());
      }
    } catch(e){}
  })();
  </script>
  <style>
    :root{
      --bg:#f7f4ee; --card:#fdfbf7; --raised:#efe9df;
      --hairline:rgba(31,27,22,.09);
      --ink:#1f1b16; --ink-2:#5e554a; --ink-3:#7b7266;
      --wood:#3a2a1d; --accent:#a63d2f;
      --ease:cubic-bezier(0.22,1,0.36,1);
    }
    *{box-sizing:border-box;}
    html,body{height:100%;}
    body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);
      font-family:-apple-system,"PingFang SC","Microsoft YaHei","Songti SC","STSong",serif;
      font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;
      display:flex;flex-direction:column;}
    main{flex:1 0 auto;}

    .navbar{background:var(--wood)!important;border-bottom:1px solid rgba(255,255,255,.1)!important;}
    .navbar-brand{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:500;color:#f4ede2!important;}
    .navbar-brand:hover{color:#fff!important;}
    .navbar-brand .mark{width:26px;height:26px;border:1px solid rgba(244,237,226,.45);border-radius:6px;
      display:inline-flex;align-items:center;justify-content:center;font-family:"Songti SC","STSong","SimSun",serif;font-size:14px;}
    .nav-btns{display:flex;gap:8px;}
    .navbar .btn{border-radius:8px;font-size:13px;}
    .navbar .btn-light{background:#f4ede2;border-color:#f4ede2;color:var(--wood);font-weight:500;}
    .navbar .btn-light:hover{background:#fff;color:var(--wood);}
    .navbar .btn-outline-light{color:rgba(244,237,226,.85);border-color:rgba(244,237,226,.32);}
    .navbar .btn-outline-light:hover{background:rgba(244,237,226,.1);color:#fff;}

    .qa-wrap{max-width:920px;margin:0 auto;padding:32px 24px 48px;}
    .qa-hero{margin-bottom:28px;}
    .qa-hero h1{font-family:"Songti SC","STSong","SimSun",serif;font-size:30px;line-height:1.15;
      font-weight:500;letter-spacing:-.01em;margin:0 0 8px;color:var(--ink);}
    .qa-hero p{margin:0;color:var(--ink-2);font-size:14px;max-width:52em;}
    .qa-hero .scope{display:inline-flex;align-items:center;gap:6px;margin-top:10px;font-size:12px;color:var(--ink-3);}
    .qa-hero .scope::before{content:"";width:14px;height:1px;background:var(--accent);}

    .suggestions{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px;}
    .feature-card{cursor:pointer;background:var(--card);border:1px solid var(--hairline);border-radius:12px;
      padding:16px;text-align:left;transition:border-color .14s var(--ease);}
    .feature-card:hover{border-color:rgba(31,27,22,.22);}
    .feature-card .fc-icon{display:flex;align-items:center;height:24px;color:var(--ink-2);margin-bottom:10px;}
    .feature-card .fc-title{font-weight:500;color:var(--ink);font-size:14px;margin-bottom:4px;}
    .feature-card .fc-desc{font-size:12px;color:var(--ink-3);line-height:1.5;}
    @media(max-width:768px){.suggestions{grid-template-columns:repeat(2,1fr);}}
    @media(max-width:480px){.suggestions{grid-template-columns:1fr;}}

    .chat-card{border:1px solid var(--hairline);border-radius:12px;overflow:hidden;background:var(--card);
      box-shadow:0 1px 2px rgba(0,0,0,.03);}
    .chat-card .card-body{height:min(52vh,520px);overflow-y:auto;padding:20px;}
    .chat-card .card-body::-webkit-scrollbar{width:8px;}
    .chat-card .card-body::-webkit-scrollbar-thumb{background:#d9cfbf;border-radius:8px;}
    .chat-card .card-body::-webkit-scrollbar-track{background:transparent;}

    .msg{display:flex;gap:10px;margin-bottom:16px;align-items:flex-start;animation:msgIn .2s var(--ease) both;}
    .msg.user{flex-direction:row-reverse;}
    @keyframes msgIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
    .avatar{width:30px;height:30px;flex:0 0 auto;border-radius:8px;display:flex;align-items:center;justify-content:center;
      background:var(--raised);color:var(--ink-2);font-size:12px;}
    .msg.user .avatar{background:var(--wood);color:#f4ede2;}
    .bubble{max-width:78%;padding:12px 14px;border-radius:10px;line-height:1.75;white-space:pre-wrap;
      word-break:break-word;font-size:14px;border:1px solid var(--hairline);background:var(--card);}
    .msg.user .bubble{background:var(--raised);border-color:transparent;border-bottom-right-radius:4px;}
    .msg.bot .bubble{border-bottom-left-radius:4px;}
    .msg.bot .bubble.notice{background:#fbf6f1;border-color:rgba(166,61,47,.22);color:var(--ink-2);}
    .rewriting-hint{color:var(--ink-3);font-size:12px;letter-spacing:.2px;}
    .img-preview{display:flex;align-items:center;gap:8px;margin-bottom:8px;}
    .img-preview img{height:52px;width:auto;max-width:160px;object-fit:contain;border:1px solid var(--hairline);border-radius:6px;background:#fff;}
    .img-preview button{border:0;background:var(--raised);color:var(--ink-2);width:20px;height:20px;border-radius:50%;
      line-height:18px;cursor:pointer;font-size:14px;padding:0;}
    .user-img{display:block;max-width:180px;max-height:140px;object-fit:contain;border-radius:6px;margin-top:6px;}
    .typing{display:inline-flex;gap:4px;padding:4px 2px;}
    .typing i{width:6px;height:6px;border-radius:50%;background:var(--ink-3);opacity:.5;animation:typing 1.1s infinite;}
    .typing i:nth-child(2){animation-delay:.15s;}
    .typing i:nth-child(3){animation-delay:.3s;}
    @keyframes typing{0%,60%,100%{transform:translateY(0);opacity:.4;}30%{transform:translateY(-4px);opacity:1;}}
    .cursor::after{content:"▌";animation:blink 1s steps(1) infinite;color:var(--ink-3);}
    @keyframes blink{50%{opacity:0;}}

    .cites{margin-top:12px;border-top:1px solid var(--hairline);padding-top:10px;}
    .cites .cite-title{font-size:12px;color:var(--ink-3);margin-bottom:6px;}
    .cite-chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;border-radius:6px;padding:4px 10px;
      margin:3px 6px 3px 0;cursor:pointer;color:var(--ink-2);border:1px solid var(--hairline);background:var(--bg);
      transition:border-color .14s var(--ease),color .14s var(--ease);}
    .cite-chip:hover{border-color:var(--accent);color:var(--accent);}
    .cite-chip::before{content:"";display:inline-block;width:2px;height:11px;background:var(--accent);}

    .chat-card .card-footer{border-top:1px solid var(--hairline);background:var(--card);padding:14px 16px;}
    .form-control{border-radius:8px;border-color:var(--hairline);font-size:14px;}
    .form-control:focus{border-color:var(--ink-3);box-shadow:0 0 0 .2rem rgba(31,27,22,.06);}
    .btn-primary{background:var(--accent);border-color:var(--accent);font-weight:500;border-radius:8px;}
    .btn-primary:hover,.btn-primary:focus{background:#8f3226;border-color:#8f3226;}
    .btn-primary:disabled{opacity:.55;}
    .form-text{color:var(--ink-3);font-size:12px;}

    #srcModal .modal-content{border:none;border-radius:12px;overflow:hidden;}
    #srcModal .modal-header{background:var(--wood);color:#f4ede2;border-bottom:none;padding:14px 18px;}
    #srcModal .modal-title{font-weight:500;font-size:14px;}
    #srcModal .btn-close{filter:brightness(0) invert(1);opacity:.8;}
    #srcModal .modal-body{line-height:1.9;color:var(--ink);padding:18px 20px;font-size:14px;}

    .qa-footer{flex-shrink:0;background:var(--wood);color:rgba(244,237,226,.75);padding:16px 0;font-size:12px;}
    .qa-footer .container{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
    .qa-footer .container>span:first-child{font-weight:500;color:#f4ede2;}

    .bgm{position:fixed;right:16px;bottom:16px;z-index:9999;display:flex;align-items:center;gap:10px;
      background:var(--card);border:1px solid var(--hairline);border-radius:8px;padding:7px 12px 7px 7px;
      box-shadow:0 1px 2px rgba(0,0,0,.05);font-family:inherit;}
    .bgm-btn{width:32px;height:32px;border-radius:6px;border:none;background:var(--wood);color:#f4ede2;
      display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;}
    .bgm-btn .ic-pause{display:none;}
    .bgm-btn.playing .ic-play{display:none;}
    .bgm-btn.playing .ic-pause{display:block;}
    .bgm-name{font-size:12px;color:var(--ink-2);white-space:nowrap;}
    .bgm-vol{-webkit-appearance:none;appearance:none;width:88px;height:3px;border-radius:2px;background:var(--raised);outline:none;cursor:pointer;}
    .bgm-vol::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--card);cursor:pointer;}
    .bgm-vol::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--accent);border:2px solid var(--card);cursor:pointer;}
    @media(max-width:520px){.bgm-name{display:none;}.bgm-vol{width:64px;}}
    @media(prefers-reduced-motion:reduce){.msg,.typing i,.cursor::after{animation:none!important;}}
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark py-2 flex-nowrap">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand" href="/"><span class="mark">岐</span> 岐黄溯智</a>
    <div class="nav-btns ms-auto d-flex me-3">
      <a class="btn btn-light btn-sm px-3" href="/">首页</a>
      <a class="btn btn-outline-light btn-sm px-3" href="/admin/login.html">登录</a>
    </div>
  </div>
</nav>

<main class="qa-wrap">

  <header class="qa-hero">
    <h1>智能问答</h1>
    <p>依据平台知识库作答，覆盖方剂、药材、食疗与文献，每条回答都可点击查看出处原文。</p>
    <span class="scope">知识库收录 37,678 条方剂与本草条目，展示页的部分科普内容可能尚未收录</span>
  </header>

  <div class="suggestions" id="suggestions">
    <div class="suggestion feature-card" data-q="有哪些经典方剂可以治疗感冒？">
      <div class="fc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h9a2 2 0 0 1 2 2v14H8a2 2 0 0 1-2-2z"/><path d="M6 3c-2 1-3 3-3 6s1 8 3 9"/><path d="M10 7h5M10 11h5"/></svg></div>
      <div class="fc-title">方剂查询</div>
      <div class="fc-desc">经典名方的组成、功效与适应证</div>
    </div>
    <div class="suggestion feature-card" data-q="当归的功效与用法用量？">
      <div class="fc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V8"/><path d="M12 12c-3-1-5-3-5-6 3 0 5 2 5 6z"/><path d="M12 14c3-1 5-3 5-6-3 0-5 2-5 6z"/></svg></div>
      <div class="fc-title">药材解读</div>
      <div class="fc-desc">性味归经、功效与临床用法</div>
    </div>
    <div class="suggestion feature-card" data-q="失眠有什么食疗方推荐？">
      <div class="fc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16a8 8 0 0 1-16 0z"/><path d="M9 11V7a3 3 0 0 1 6 0v4"/></svg></div>
      <div class="fc-title">食疗推荐</div>
      <div class="fc-desc">日常调理与药膳方案</div>
    </div>
    <div class="suggestion feature-card" data-q="四物汤出自哪本古籍？">
      <div class="fc-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v14H6a2 2 0 0 1-2-2z"/><path d="M15 3v18"/><path d="M8 8h4M8 12h4"/></svg></div>
      <div class="fc-title">文献溯源</div>
      <div class="fc-desc">出处考证与原文引用</div>
    </div>
  </div>

  <div class="card chat-card">
    <div class="card-body" id="chat"></div>
    <div class="card-footer bg-white">
      <div class="input-group">
        <button id="imgBtn" class="btn btn-outline-secondary" type="button" title="上传图片：有文字就提取，是药材就识别并生成问题"
          style="border-radius:8px 0 0 8px;border-color:var(--hairline);color:var(--ink-2);font-size:13px;white-space:nowrap;">
          识图提问
        </button>
        <input id="q" class="form-control" placeholder="输入问题，或上传方剂/药材图片自动识别" maxlength="1000"
          style="border-left:0;">
        <button id="btn" class="btn btn-primary px-4">提问</button>
        <input type="file" id="imgFile" accept="image/png,image/jpeg,image/webp" hidden>
      </div>
      <div class="form-text mt-1" id="ocrHint">回答由 AI 依据知识库生成，用药请遵医嘱。</div>
    </div>
  </div>
</main>

<footer class="qa-footer">
  <div class="container">
    <span>岐黄溯智 · 智能问答</span>
    <span class="qa-footer-note">回答由 AI 依据知识库生成，用药请遵医嘱</span>
  </div>
</footer>

<div class="modal fade" id="srcModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header py-2">
        <h6 class="modal-title" id="srcTitle"></h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body" id="srcBody"></div>
    </div>
  </div>
</div>

<script src="/lib/bootstrap/bootstrap.bundle.min.js"></script>
<script src="js/qa.js"></script>

<div class="bgm" id="bgm">
  <button class="bgm-btn" id="bgmBtn" type="button" aria-label="播放背景音乐">
    <svg class="ic-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
    <svg class="ic-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
  </button>
  <span class="bgm-name">古筝 · 高山流水</span>
  <input class="bgm-vol" id="bgmVol" type="range" min="0" max="100" value="50" aria-label="音量">
  <audio id="bgmAudio" loop preload="none" src="https://chinesemusicworld.com/mp3lib/Guzheng-High-Mountain-and-Running-River-gao-shan-liu-shui.mp3"></audio>
</div>
<script>
(function(){
  var KEY_VOL='bgm_vol', KEY_ON='bgm_on';
  var audio=document.getElementById('bgmAudio');
  var btn=document.getElementById('bgmBtn');
  var vol=document.getElementById('bgmVol');
  var v=parseFloat(localStorage.getItem(KEY_VOL));
  if(isNaN(v)) v=0.5;
  audio.volume=v; vol.value=Math.round(v*100);
  function reflect(){ if(audio.paused){ btn.classList.remove('playing'); btn.setAttribute('aria-label','播放背景音乐'); } else { btn.classList.add('playing'); btn.setAttribute('aria-label','暂停背景音乐'); } }
  function play(){ audio.play().then(function(){ localStorage.setItem(KEY_ON,'1'); reflect(); }).catch(function(){ localStorage.setItem(KEY_ON,'0'); reflect(); }); }
  function pause(){ audio.pause(); localStorage.setItem(KEY_ON,'0'); reflect(); }
  btn.addEventListener('click', function(e){ e.stopPropagation(); if(audio.paused) play(); else pause(); });
  vol.addEventListener('input', function(){ var x=vol.value/100; audio.volume=x; localStorage.setItem(KEY_VOL, x); });
  audio.addEventListener('play', reflect);
  audio.addEventListener('pause', reflect);
  if(localStorage.getItem(KEY_ON)==='1'){
    audio.play().then(function(){ reflect(); }).catch(function(){
      var resume=function(){ if(localStorage.getItem(KEY_ON)==='1' && audio.paused){ audio.play().then(reflect).catch(function(){}); } };
      document.addEventListener('click', resume, {once:true});
      document.addEventListener('touchstart', resume, {once:true});
      reflect();
    });
  } else { reflect(); }
})();
</script>
</body>
</html>
