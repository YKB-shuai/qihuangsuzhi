<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>注册 · 岐黄溯智</title>
  <link rel="stylesheet" href="/lib/bootstrap/bootstrap.min.css">
  <style>
    /* ===== 注册页：与登录页同款新中式极简国风（内联，规避缓存） ===== */
    :root{
      --green:#6b4a30; --green-d:#4a3220; --cream:#f7f1e6;
      --gold:#b8894b; --ink:#3a2e22; --muted:#9a8b7a; --line:#e5dac4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; }
    .navbar { position: fixed !important; top: 0; left: 0; right: 0; z-index: 1030; background: var(--green) !important; border-bottom: 1px solid var(--green-d) !important; }
    .navbar-brand { font-weight: 600; letter-spacing: .5px; color: #fff !important; }
    .navbar-brand:hover { color: #fff !important; }
    .login-split { display: flex; margin-top: 56px; min-height: calc(100vh - 56px); }
    .brand-pane {
      flex: 1 1 50%; position: relative; overflow: hidden;
      background: linear-gradient(155deg, #3d2718 0%, #6b4a30 55%, #8a6442 100%); color: #fff;
    }
    .brand-vertical { position: absolute; top: 28px; left: 28px; writing-mode: vertical-rl; letter-spacing: 6px; font-family: "Songti SC","STSong","SimSun",serif; font-size: .82rem; opacity: .7; }
    .brand-badge { position: absolute; top: 24px; right: 24px; width: 44px; height: 44px; border: 1px solid var(--gold); border-radius: 6px; display: flex; align-items: center; justify-content: center; font-family: "Songti SC","STSong",serif; font-size: .8rem; color: var(--gold); opacity: .85; letter-spacing: 1px; }
    .brand-bottom { position: absolute; left: 40px; right: 40px; bottom: 44px; }
    .brand-title { font-family: "Songti SC","STSong","SimSun",serif; font-size: 38px; font-weight: 400; letter-spacing: 2px; margin: 0 0 .5rem; }
    .brand-slogan { font-size: 13px; letter-spacing: 1px; opacity: .8; margin: 0 0 1.8rem; }
    .brand-points { list-style: none; padding: 0; margin: 0; }
    .brand-points li { position: relative; padding-left: 18px; margin: .55rem 0; font-size: .95rem; opacity: .9; }
    .brand-points li::before { content: ''; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); opacity: .9; }
    .form-pane { flex: 1 1 50%; background: var(--cream); display: flex; align-items: center; justify-content: center; padding: 40px 32px; }
    .auth-card { width: 100%; max-width: 380px; }
    .welcome { color: var(--muted); font-size: .9rem; letter-spacing: 2px; margin: 0 0 .3rem; }
    .auth-title { font-size: 28px; font-weight: 500; color: var(--ink); margin: 0 0 1.4rem; letter-spacing: 1px; }
    .gold-rule { display: block; width: 46px; height: 2px; background: var(--gold); margin-top: 10px; }
    .field { position: relative; margin-bottom: 12px; }
    .field-input { width: 100%; padding: 11px 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink); font-size: .95rem; outline: none; transition: border-color .15s; }
    .field-input::placeholder { color: #a99a82; }
    .field-input:focus { border-color: var(--green); }
    .pwd-field .eye { position: absolute; top: 50%; right: 10px; transform: translateY(-50%); background: none; border: none; color: var(--muted); cursor: pointer; padding: 4px; }
    .pwd-field .eye:hover { color: var(--green); }
    .pwd-field .field-input { padding-right: 44px; }
    .field-hint { font-size: .78rem; color: var(--muted); margin: 5px 2px 0; }
    .role-note { background: #f5eee1; border: 1px solid #e8dcc6; color: var(--green); border-radius: 10px; padding: 10px 12px; font-size: .83rem; line-height: 1.6; margin: 16px 0; }
    .btn-primary { width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent, #a63d2f); color: #fff; border: none; border-radius: 12px; padding: 13px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    .btn-primary:hover { background: #8f3226; }
    .btn-primary:disabled { opacity: .65; cursor: not-allowed; }
    .login-tip { text-align: center; margin: 20px 0 0; color: var(--muted); font-size: .88rem; }
    .login-tip a { color: var(--green); font-weight: 600; text-decoration: none; }
    .login-tip a:hover { text-decoration: underline; }
    @media (max-width: 900px) {
      .login-split { flex-direction: column; }
      .brand-pane { flex: none; min-height: 220px; }
      .brand-bottom { position: static; padding: 28px 24px 32px; }
      .brand-vertical, .brand-badge { display: none; }
      .form-pane { flex: none; padding: 36px 24px; }
    }

  </style>

<!-- 品牌版本守卫：检测到旧缓存页自动刷新到新版（一次性，避免死循环） -->
<script>
(function(){
  try {
    if (sessionStorage.getItem('qh_vguard_ok') === '1') return;
    var html = document.documentElement.innerHTML || '';
    if (html.indexOf('东方草木') !== -1 || html.indexOf('ORIENTAL HERBS') !== -1) {
      sessionStorage.setItem('qh_vguard_ok','1');
      var u = new URL(location.href);
      u.searchParams.set('_v', String(Date.now()));
      location.replace(u.toString());
    }
  } catch(e){}
})();
</script>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark py-2 flex-nowrap">
  <div class="container-fluid px-3 px-lg-4">
    <a class="navbar-brand" href="/"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" style="vertical-align:-3px;margin-right:4px"><rect x="1.5" y="1.5" width="21" height="21" rx="4" stroke="#b8894b" stroke-width="1.3"/><text x="12" y="17.5" text-anchor="middle" font-size="14" font-weight="700" font-family="SimSun,serif" fill="#b8894b">岐</text></svg> 岐黄溯智</a>
  </div>
</nav>

<div class="login-split">
  <aside class="brand-pane">
    <div class="brand-vertical">岐黄为源 · 悬壶济世</div>
    <div class="brand-badge">本草</div>
    <div class="brand-bottom">
      <h1 class="brand-title">岐黄溯智</h1>
      <p class="brand-slogan">QIHUANG WISDOM · 岐黄为源 · 溯智致远</p>
      <ul class="brand-points">
        <li>经典方剂与古籍文献溯源</li>
        <li>道地药材图文解读</li>
        <li>辨证食疗方案推荐</li>
        <li>智能问答 · 引用可查</li>
      </ul>
    </div>
  </aside>

  <main class="form-pane">
    <div class="auth-card">
      <p class="welcome">加入岐黄溯智</p>
      <h1 class="auth-title">注册账号</h1>

      <div id="err" class="alert alert-danger py-2 small d-none"></div>
      <div class="field">
        <input id="username" class="field-input" autocomplete="username" placeholder="用户名（3–50 个字符）" maxlength="50">
      </div>
      <div class="field">
        <input id="nickname" class="field-input" placeholder="昵称（选填）" maxlength="50">
      </div>
      <div class="field">
        <input id="phone" class="field-input" placeholder="手机号（选填）" maxlength="20">
      </div>
      <div class="field pwd-field">
        <input id="password" type="password" class="field-input" autocomplete="new-password" placeholder="密码（至少 6 位）">
        <button type="button" class="eye" id="eye" aria-label="显示密码">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>
      <div class="field">
        <input id="password2" type="password" class="field-input" autocomplete="new-password" placeholder="确认密码">
      </div>
      <div class="role-note">注册账号统一为<strong>普通用户</strong>，可浏览科普内容与使用智能问答，不具备后台管理权限。</div>
      <button id="btn" class="btn-primary" type="button">
        注 册
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
      <p class="login-tip">已有账号？<a href="/admin/login.html">返回登录</a></p>
    </div>
  </main>
</div>

<script>
  var btn = document.getElementById('btn');
  var errBox = document.getElementById('err');
  btn.onclick = doRegister;
  document.addEventListener('keydown', function (e) { if (e.key === 'Enter') doRegister(); });

  function showErr(msg) {
    errBox.textContent = msg;
    errBox.classList.remove('d-none');
  }

  async function doRegister() {
    var username = document.getElementById('username').value.trim();
    var nickname = document.getElementById('nickname').value.trim();
    var phone = document.getElementById('phone').value.trim();
    var password = document.getElementById('password').value;
    var password2 = document.getElementById('password2').value;
    errBox.classList.add('d-none');
    if (username.length < 3 || username.length > 50) return showErr('用户名长度需为 3–50 个字符');
    if (password.length < 6) return showErr('密码至少 6 位');
    if (password !== password2) return showErr('两次输入的密码不一致');
    btn.disabled = true;
    try {
      var r = await fetch('/api/sys/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username, nickname: nickname, phone: phone, password: password })
      }).then(function (x) { return x.json(); });
      if (r.code !== 0) return showErr(r.msg || '注册失败');
      localStorage.setItem('tcm_token', r.data.token);   // 注册成功后直接登录，按角色进入前台
      location.href = '/';
    } catch (e) {
      showErr('网络错误：' + e.message);
    } finally {
      btn.disabled = false;
    }
  }

  var eye = document.getElementById('eye');
  var pwd = document.getElementById('password');
  var eyeOpen = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var eyeClosed = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18"/><path d="M10.6 6.2A10.9 10.9 0 0 1 12 6c6.5 0 10 6 10 6a18 18 0 0 1-3.2 3.8M6.5 7.6A18 18 0 0 0 2 12s3.5 7 10 7a10.8 10.8 0 0 0 4.4-.9"/></svg>';
  eye.addEventListener('click', function () {
    if (pwd.type === 'password') { pwd.type = 'text'; eye.innerHTML = eyeClosed; }
    else { pwd.type = 'password'; eye.innerHTML = eyeOpen; }
  });
</script>
</body>
</html>
