<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>详情 · 岐黄溯智</title>
  <script>
    if (!localStorage.getItem('tcm_token')) location.href = '/admin/login.html';
  </script>
  <style>
    :root{ --green:#6b4a30; --green-d:#4a3220; --green-l:#8a6a4a; --cream:#f7f1e6; --cream-2:#f0e7d5; --gold:#b8894b; --ink:#3a2e22; --muted:#9a8b7a; --line:#e5dac4; }
    *{box-sizing:border-box;}
    body{margin:0;background:var(--cream);color:var(--ink);font-family:-apple-system,"PingFang SC","Microsoft YaHei","Songti SC","STSong",serif;line-height:1.7;}
    a{text-decoration:none;color:inherit;}
    .wrap{max-width:1120px;margin:0 auto;padding:0 24px;}

    .nav{position:fixed;top:0;left:0;right:0;z-index:1030;background:var(--green);border-bottom:1px solid var(--green-d);}
    .nav-inner{display:flex;align-items:center;gap:28px;height:64px;}
    .brand{display:flex;align-items:center;gap:10px;color:#fff;}
    .brand .logo{width:34px;height:34px;border:1.5px solid var(--gold);border-radius:8px;transform:rotate(-4deg);display:flex;align-items:center;justify-content:center;}
    .brand .name{font-size:1.15rem;font-weight:700;letter-spacing:2px;}
    .brand .sub{font-size:.58rem;letter-spacing:2px;color:var(--gold);opacity:.85;}
    .nav-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
    .btn-gold{background:var(--gold);color:#2a2113;border:none;border-radius:22px;padding:9px 20px;font-weight:700;font-size:.9rem;cursor:pointer;transition:.15s;}
    .btn-gold:hover{background:#c79a55;}
    .btn-outline{background:none;color:#fff;border:1px solid rgba(255,255,255,.5);border-radius:22px;padding:8px 18px;font-size:.9rem;cursor:pointer;transition:.15s;}
    .btn-outline:hover{background:rgba(255,255,255,.12);}

    .back{display:inline-flex;align-items:center;gap:6px;color:var(--green);font-size:.9rem;margin:88px 0 18px;}
    .back:hover{color:var(--gold);}

    /* 两列布局 */
    .detail-grid{display:grid;grid-template-columns:360px 1fr;gap:30px;align-items:start;}

    /* 左侧固定身份栏 */
    .side{position:sticky;top:88px;background:linear-gradient(160deg,#3d2718 0%,#6b4a30 100%);color:#fff;border-radius:18px;padding:26px 26px 30px;box-shadow:0 10px 30px rgba(74,50,32,.18);}
    .side .dh-img{width:100%;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:rgba(255,255,255,.92);padding:10px;border:1px solid var(--gold);box-shadow:0 8px 22px rgba(0,0,0,.25);}
    .side .dh-img img{width:100%;height:100%;object-fit:contain;display:block;}
    /* 无插画条目：首字占位（米白底 + 金线双环 + 墨绿大字） */
    .side .dh-img.ph{display:flex;align-items:center;justify-content:center;position:relative;
      background:radial-gradient(circle at 50% 45%, #fdf9ef 0%, #efe4cc 72%);}
    .side .dh-img.ph::before{content:"";position:absolute;width:58%;aspect-ratio:1/1;border-radius:50%;
      border:1px solid rgba(184,137,75,.6);}
    .side .dh-img.ph::after{content:"";position:absolute;width:46%;aspect-ratio:1/1;border-radius:50%;
      border:1px dashed rgba(184,137,75,.4);}
    .side .dh-img.ph span{font-family:"Songti SC","STSong",serif;font-size:3.2rem;color:var(--green);letter-spacing:4px;z-index:1;line-height:1;}
    .side .ctag{display:inline-block;font-size:.78rem;color:#2a2113;background:var(--gold);border-radius:20px;padding:4px 15px;letter-spacing:1px;margin-top:20px;}
    .side h1{margin:14px 0 4px;font-size:2.1rem;letter-spacing:4px;font-family:"Songti SC","STSong",serif;}
    .side .py{color:var(--gold);letter-spacing:2px;font-size:.9rem;}
    .side .summary{margin:14px 0 22px;color:rgba(255,255,255,.82);font-size:.95rem;}
    .side .ask-cta a{display:block;text-align:center;background:var(--gold);color:#2a2113;border-radius:24px;padding:12px 20px;font-size:.95rem;letter-spacing:1px;font-weight:700;transition:.15s;}
    .side .ask-cta a:hover{background:#c79a55;}

    /* 右侧信息卡片网格 */
    .main{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;align-content:start;}
    .field{background:#fff;border:1px solid var(--line);border-left:3px solid var(--gold);border-radius:12px;padding:18px 20px;transition:.15s;}
    .field:hover{border-color:var(--gold);box-shadow:0 6px 18px rgba(74,50,32,.08);}
    .field .fl{color:var(--gold);font-size:.82rem;letter-spacing:2px;margin-bottom:8px;font-weight:700;}
    .field .fv{color:var(--ink);font-size:.96rem;}
    .field.wide{grid-column:1 / -1;}

    .empty{grid-column:1 / -1;text-align:center;color:var(--muted);padding:80px 0;}
    .empty .big{font-size:1.3rem;color:var(--ink);margin-bottom:10px;}

    @media(max-width:860px){
      .detail-grid{grid-template-columns:1fr;}
      .side{position:static;}
      .main{grid-template-columns:1fr;}
    }
    .footer{background:var(--green-d);color:rgba(255,255,255,.5);padding:30px 0;margin-top:46px;text-align:center;font-size:.82rem;}

  </style>

<!-- 品牌版本守卫：检测到旧缓存页自动刷新到新版（一次性，避免死循环） -->
<script>
(function(){
  try {
    if (sessionStorage.getItem('qh_vguard_ok') === '1') return;
    var html = document.documentElement.innerHTML || '';
    if (html.indexOf('东方草木') !== -1 || html.indexOf('ORIENTAL HERBS') !== -1) {
      sessionStorage.setItem('qh_vguard_ok','1');
      var u = new URL(location.href);
      u.searchParams.set('_v', String(Date.now()));
      location.replace(u.toString());
    }
  } catch(e){}
})();
</script>
</head>
<body>

<nav class="nav">
  <div class="wrap nav-inner">
    <a class="brand" href="/">
      <span class="logo"><svg width="22" height="22" viewBox="0 0 24 24" fill="none"><text x="12" y="17.5" text-anchor="middle" font-size="15" font-weight="700" font-family="&apos;Songti SC&apos;,&apos;STSong&apos;,&apos;SimSun&apos;,serif" fill="#b8894b">岐</text></svg></span>
      <span><span class="name">岐黄溯智</span><br><span class="sub">QIHUANG WISDOM</span></span>
    </a>
    <div class="nav-right">
      <a class="btn-gold" href="/qa/">进入问答</a>
      <a class="btn-outline" href="/admin/" id="adminBtn">知识库管理</a>
    </div>
  </div>
</nav>

<div class="wrap">
  <a class="back" href="/list/?type=herb" id="backLink">← 返回列表</a>
  <div id="content">
    <div class="detail-grid">
      <div class="empty"><div class="big">加载中…</div></div>
    </div>
  </div>
</div>

<footer class="footer">本平台内容仅供中医药文化学习与科普参考，不能替代专业医师的诊断与治疗。</footer>

<script>
  (function(){var t=localStorage.getItem('tcm_token');if(!t)return;fetch('/api/sys/me',{headers:{'X-Token':t}}).then(r=>r.json()).then(d=>{if(d.code===0&&d.data.role===3){var b=document.getElementById('adminBtn');if(b)b.style.display='none';}}).catch(function(){});})();

  const id = new URLSearchParams(location.search).get('id');
  const content = document.getElementById('content');

  if (!id) { content.innerHTML = '<div class="detail-grid"><div class="empty"><div class="big">未指定条目</div><p><a class="btn-gold" href="/">返回首页</a></p></div></div>'; }

  fetch('/data/catalog.json').then(r=>r.json()).then(data=>{
    let item = null;
    for (const k in data) { const f = data[k].find(x=>x.id===id); if (f) { item = f; break; } }
    if (!item) { content.innerHTML = '<div class="detail-grid"><div class="empty"><div class="big">未找到该条目</div><p><a class="btn-gold" href="/">返回首页</a></p></div></div>'; return; }

    // 返回链接按类型回到对应列表
    const typeBack = {herb:'herb',formula:'formula',diet:'diet',meridian:'meridian',constitution:'constitution',classic:'classic',doctor:'doctor',story:'story'}[item.type] || 'herb';
    document.getElementById('backLink').href = '/list/?type=' + typeBack;

    // 右侧字段：长内容（含“；”或较长文本）占整行，其余两列排布
    const fields = (item.fields||[]).map(f=>{
      const wide = (f.value.length > 34) ? ' wide' : '';
      return `<div class="field${wide}"><div class="fl">${f.label}</div><div class="fv">${f.value}</div></div>`;
    }).join('');

    content.innerHTML = `
      <div class="detail-grid">
        <aside class="side">
          ${item.img
            ? `<div class="dh-img"><img src="${item.img}" alt="${item.name}"></div>`
            : `<div class="dh-img ph"><span>${(item.name||'').replace(/[《》]/g,'').slice(0,1)}</span></div>`}
          ${item.tag ? `<span class="ctag">${item.tag}</span>` : ''}
          <h1>${item.name}</h1>
          <div class="py">${item.pinyin||''}</div>
          <p class="summary">${item.summary||''}</p>
          <div class="ask-cta">
            <a href="/qa/?q=关于${encodeURIComponent(item.name)}的更多问题，请详细讲讲">向智能助手追问「${item.name}」→</a>
            <p style="font-size:.76rem;color:var(--muted);margin:8px 0 0;text-align:center;">助手依据知识库语料作答，部分展示内容可能尚未收录。</p>
          </div>
        </aside>
        <section class="main">${fields}</section>
      </div>`;
    document.title = item.name + ' · 岐黄溯智';
  }).catch(()=>{ content.innerHTML = '<div class="detail-grid"><div class="empty"><div class="big">内容加载失败</div><p>请刷新重试。</p></div></div>'; });
</script>
<!-- 背景音乐播放器 -->
<div class="bgm" id="bgm">
  <div class="bgm-box">
    <button class="bgm-btn" id="bgmBtn" type="button" aria-label="播放背景音乐">
      <svg class="ic-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg class="ic-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
    </button>
    <div class="bgm-info">
      <div class="bgm-name">古筝 · 高山流水</div>
      <input class="bgm-vol" id="bgmVol" type="range" min="0" max="100" value="50" aria-label="音量">
    </div>
  </div>
  <audio id="bgmAudio" loop preload="none" src="https://chinesemusicworld.com/mp3lib/Guzheng-High-Mountain-and-Running-River-gao-shan-liu-shui.mp3"></audio>
</div>
<style>
  .bgm{position:fixed;right:18px;bottom:18px;z-index:9999;font-family:inherit;}
  .bgm-box{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);border:1px solid #e5dac4;border-radius:40px;padding:8px 16px 8px 8px;box-shadow:0 8px 24px rgba(107,74,48,.18);}
  .bgm-btn{position:relative;width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#6b4a30,#6b4a30);color:#b8894b;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 auto;transition:transform .2s,box-shadow .2s;}
  .bgm-btn:hover{transform:scale(1.06);}
  .bgm-btn.playing{box-shadow:0 0 0 4px rgba(184,137,75,.28);}
  .bgm-btn .ic-pause{display:none;}
  .bgm-btn.playing .ic-play{display:none;}
  .bgm-btn.playing .ic-pause{display:block;}
  .bgm-info{display:flex;flex-direction:column;gap:5px;min-width:118px;}
  .bgm-name{font-size:.76rem;color:#6b4a30;font-weight:600;letter-spacing:.5px;white-space:nowrap;}
  .bgm-vol{-webkit-appearance:none;appearance:none;width:118px;height:4px;border-radius:3px;background:linear-gradient(to right,#b8894b var(--p,50%),#e5dac4 var(--p,50%));outline:none;cursor:pointer;}
  .bgm-vol::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:13px;height:13px;border-radius:50%;background:#b8894b;border:2px solid #fff;box-shadow:0 1px 3px rgba(0,0,0,.2);cursor:pointer;}
  .bgm-vol::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:#b8894b;border:2px solid #fff;cursor:pointer;}
  @media (max-width:520px){ .bgm-info{min-width:90px;} .bgm-vol{width:90px;} .bgm-name{font-size:.7rem;} }
</style>
<script>
(function(){
  var KEY_VOL='bgm_vol', KEY_ON='bgm_on';
  var audio=document.getElementById('bgmAudio');
  var btn=document.getElementById('bgmBtn');
  var vol=document.getElementById('bgmVol');
  var v=parseFloat(localStorage.getItem(KEY_VOL));
  if(isNaN(v)) v=0.5;
  audio.volume=v; vol.value=Math.round(v*100);
  vol.style.setProperty('--p', vol.value+'%');
  function reflect(){ if(audio.paused){ btn.classList.remove('playing'); btn.setAttribute('aria-label','播放背景音乐'); } else { btn.classList.add('playing'); btn.setAttribute('aria-label','暂停背景音乐'); } }
  function play(){ audio.play().then(function(){ localStorage.setItem(KEY_ON,'1'); reflect(); }).catch(function(){ localStorage.setItem(KEY_ON,'0'); reflect(); }); }
  function pause(){ audio.pause(); localStorage.setItem(KEY_ON,'0'); reflect(); }
  btn.addEventListener('click', function(e){ e.stopPropagation(); if(audio.paused) play(); else pause(); });
  vol.addEventListener('input', function(){ var x=vol.value/100; audio.volume=x; localStorage.setItem(KEY_VOL, x); vol.style.setProperty('--p', vol.value+'%'); });
  audio.addEventListener('play', reflect);
  audio.addEventListener('pause', reflect);
  if(localStorage.getItem(KEY_ON)==='1'){
    audio.play().then(function(){ reflect(); }).catch(function(){
      var resume=function(){ if(localStorage.getItem(KEY_ON)==='1' && audio.paused){ audio.play().then(reflect).catch(function(){}); } };
      document.addEventListener('click', resume, {once:true});
      document.addEventListener('touchstart', resume, {once:true});
      reflect();
    });
  } else { reflect(); }
})();
</script>
</body>
</html>
